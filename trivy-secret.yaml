# Secret-scanner allow-rules for the CI image scan
# (.github/workflows/image_scan.yml). See that file's header comment for the
# full rationale; this file holds only the rule itself.
#
# Scope: paths under the production image's vendored bundle
# (/usr/local/bundle, per the Dockerfile's BUNDLE_PATH) that sit inside a
# gem's own `spec/` or `test/` directory. Those are upstream test fixtures —
# published on RubyGems, identical for every install of that gem version,
# and never loaded by the running app (Bundler installs with
# BUNDLE_WITHOUT="development:test", and nothing `require`s a gem's own spec
# suite). They are not reachable secrets; they are noise.
#
# Deliberately NOT global: this does not disable the `private-key` (or any
# other) rule outright, and it does not match anywhere outside the vendored
# bundle path. A real key or credential committed under app/, config/, or
# anywhere else in the image still fails the scan.
allow-rules:
  - id: vendored-gem-test-fixtures
    description: >-
      Upstream gems' own spec/test fixtures under the vendored bundle path
      are not secrets — e.g. openid_connect-2.5.0's
      spec/mock_response/public_keys/private_key.pem, a mock RSA key
      published on RubyGems and identical for every install (flagged
      2026-08-07 after Trivy's secret rules changed in v0.70; see
      image_scan.yml).
    path: (^|/)usr/local/bundle/ruby/[0-9.]+/gems/[^/]+/(spec|test)/
