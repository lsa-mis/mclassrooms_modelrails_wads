  TDX_CLIENT_ID: "TeamDynamix feedback ticket setting; with any TDX value unset, feedback is emailed to the admins instead"
  TDX_CLIENT_SECRET: "TeamDynamix feedback ticket setting; with any TDX value unset, feedback is emailed to the admins instead"
  TDX_FORM_ID: "TeamDynamix feedback ticket setting; with any TDX value unset, feedback is emailed to the admins instead"
  TDX_OAUTH_URL: "TeamDynamix feedback ticket setting; with any TDX value unset, feedback is emailed to the admins instead"
  TDX_PRIORITY_ID: "TeamDynamix feedback ticket setting; with any TDX value unset, feedback is emailed to the admins instead"
  TDX_RESPONSIBLE_GROUP_ID: "TeamDynamix feedback ticket setting; with any TDX value unset, feedback is emailed to the admins instead"
