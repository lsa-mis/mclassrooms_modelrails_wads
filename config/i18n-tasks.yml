  yaml:
    write:
      line_width: -1

search:
  paths:
    - app/
  relative_roots:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/views
    - app/components
    - app/notifiers
  exclude:
    - app/assets
    # Markdown served at /docs. Contains illustrative `t(".key")` snippets that
    # are documentation, not call sites.
    - app/docs
    # UI primitives mirrored from the modelrails_ui gem. Every t() in here
    # passes an inline `default:`, so an absent app key is intentional — a fork
    # adds one only to override the shipped wording.
    #
    # Excluded by PATH rather than by key namespace on purpose: `ui.*` is an
    # ordinary English word, and a fork writing t("ui.dashboard.header") in its
    # own view must still be gated.
    - app/components/ui

ignore_unused:
  # Consumed by the UI primitives under app/components/ui — that path is
  # excluded from the scanner ON PURPOSE (every t() there carries an inline
  # default; an app-level key IS the override), and the Lookbook preview
  # templates that exercise them live under spec/. Deleting these silently
  # reverts dialogs to the shipped English (#522 nearly did — 32 system
  # failures).
  - modals.close
  - modals.confirm
  # Loaded as a WHOLE HASH — I18n.t("rooms.characteristic_label_overrides",
  # default: {}) in RoomSearch — and keyed at runtime by each characteristic's
  # vendor short_code, so no per-key t() call ever appears in source. Locale
  # is the rename mechanism for vendor labels (docs/developer/rooms-directory).
  - "rooms.characteristic_label_overrides.*"
  # Looked up through Room::SUBJECTS' key registry (I18n.t(entry.fetch(:key))
  # in MediaAsset#base_derived_alt) — the per-subject derived alt text for
  # unauthored room media. No static t() call exists for any of them.
  - "media.derived_alt.room.*"
  - modals.delete
  - modals.save
  # Read at broadcast/announce time by ApplicationNotifier and the
  # notifications controller in call forms the static scanner misses;
  # deleting them turns the aria-live announcements into
  # MissingTranslationData at runtime.
  - notifications.bell.arrival_announcement
  - notifications.bell.read_state_announcement
  # Rendered via lazy/dynamic scopes the scanner cannot resolve; the system
  # and request specs assert the rendered labels/flashes, so the suite is
  # the working proof of use.
  - navigation.profile
  - settings.sidebar.items.invitations
  - workspaces.invitations.resend.recently_sent
  - workspaces.invitations.resend.resent
  # Resolved dynamically at runtime, so no static call site exists.
  - notification_mailer.digest.subject.*
  # activity_logs/_activity_log.html.erb builds the key from the record:
  #   t("activity.actions.#{activity_log.action}", default: action.humanize)
  # The `default:` is what makes this dangerous rather than merely invisible —
  # delete these and every feed entry silently degrades to a humanized column
  # value with nothing raising and the suite still green (#522).
  - activity.actions.*
  # Consumed by Rails/Active Model rather than an explicit t() call. Caveat
  # worth knowing: this also means a key left behind by a deleted validation
  # will never be reported. Removing a validation means removing its key by
  # hand — the tool cannot see that one go stale.
  - activerecord.errors.*
  - errors.*
  - helpers.*
  - date.*
  - time.*
  - number.*
  - support.*
  # Read by JS through the clientside translation bridge.
  - clientside.*

ignore_missing:
  # Mounted engines own these; the app carries no keys for them.
  - biscuit.*
  - markdowndocs.*
