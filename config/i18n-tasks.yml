    - ['email_verifications.show.*', 'config/locales/%{locale}/email_verifications.%{locale}.yml']
    - ['email_verifications.banner.*', 'config/locales/%{locale}/onboarding.%{locale}.yml']
    - ['email_verifications.new.*', 'config/locales/%{locale}/onboarding.%{locale}.yml']
    - ['errors.not_authorized', 'config/locales/%{locale}/application.%{locale}.yml']
    - ['errors.not_found', 'config/locales/%{locale}/application.%{locale}.yml']
    - ['errors.form_errors.*', 'config/locales/%{locale}/auth.%{locale}.yml']
    - ['footer.about', 'config/locales/%{locale}/application.%{locale}.yml']
    - ['footer.aria.*', 'config/locales/%{locale}/application.%{locale}.yml']
    - ['footer.contact', 'config/locales/%{locale}/application.%{locale}.yml']
