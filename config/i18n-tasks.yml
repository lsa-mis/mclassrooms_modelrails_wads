# i18n-tasks config — drives spec/i18n_spec.rb.
# Reference: https://github.com/glebm/i18n-tasks

base_locale: en

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/*.%{locale}.yml
    # Rails loads config/locales/**/*.yml regardless of a `.en.` infix, so a
    # fork naming a file config/locales/en/billing.yml gets a working app.
    # Without this glob the gate would not see it and would report every key
    # in it as missing.
    - config/locales/%{locale}/**/*.yml
  # Per-namespace router (#523): every key prefix maps to its domain-split
  # file at the minimal unique depth, so `i18n-tasks add-missing` lands new
  # keys in the right file instead of the catch-all. NOTE `normalize` itself
  # is deliberately NOT run or gated: its writer strips hand-written comments
  # (brand.en.yml's fork-seam header) and rewrites the quoting bin/fork's
  # byte-exact substitution tokens depend on — see spec/i18n_spec.rb. Three
  # hand-written specials lead (clientside share toggle, client_access model
  # errors, resources-over-projects precedence); the rest were generated from
  # the layout on 2026-08-15. A new ROOT namespace needs a rule here.
  write:
    - ['workspaces.projects.resources.edit.share_with_client', 'config/locales/%{locale}/clientside.%{locale}.yml']
    - ['workspaces.projects.resources.*', 'config/locales/%{locale}/resources.%{locale}.yml']
    - ['activerecord.errors.models.client_access.*', 'config/locales/%{locale}/clientside.%{locale}.yml']
    - ['a11y_sim.*', 'config/locales/%{locale}/a11y_sim.%{locale}.yml']
    - ['activerecord.errors.*', 'config/locales/%{locale}/auth.%{locale}.yml']
    - ['activity.*', 'config/locales/%{locale}/activity.%{locale}.yml']
    - ['application.skip_to_content', 'config/locales/%{locale}/application.%{locale}.yml']
    - ['application.description', 'config/locales/%{locale}/brand.%{locale}.yml']
    - ['application.name', 'config/locales/%{locale}/brand.%{locale}.yml']
    - ['authentication.already_signed_in', 'config/locales/%{locale}/auth.%{locale}.yml']
    - ['authentication.providers.*', 'config/locales/%{locale}/authentication.%{locale}.yml']
    - ['authentication.session_expired', 'config/locales/%{locale}/authentication.%{locale}.yml']
    - ['authentication_mailer.*', 'config/locales/%{locale}/mailers.%{locale}.yml']
    - ['clientside.*', 'config/locales/%{locale}/clientside.%{locale}.yml']
    - ['cookie_consent.*', 'config/locales/%{locale}/cookie_consent.%{locale}.yml']
    - ['direct_uploads.*', 'config/locales/%{locale}/direct_uploads.%{locale}.yml']
