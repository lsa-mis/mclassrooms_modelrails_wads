    - ['workspaces.identity_bar.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.index.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.join_links.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.joins.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.locked_notice', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.locked_row.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.members.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.new.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.not_found', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.overview.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
    - ['workspaces.pending_join_banner.*', 'config/locales/%{locale}/workspaces.%{locale}.yml']
