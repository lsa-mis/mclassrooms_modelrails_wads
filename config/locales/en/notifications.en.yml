en:
  notifications:
    placeholder: "This notification refers to something that no longer exists."
    bell:
      arrival_announcement: "New notification"
      arrival_announcement_with_severity: "New notification: %{phrase}"
      read_state_announcement: "Notifications updated"
    severity_phrase:
      danger: "a security alert"
      warning: "an important update"
      info: "an account update"
      success: "a workspace update"
    preferences:
      timezone:
        heading: "Your timezone"
        change: "Change"
        cancel: "Cancel"
        picker_label: "Timezone"
        save: "Save"
        saved_announcement: "Timezone updated"
      categories:
        security: "Security & sign-in"
        account_access: "Account & access"
        workspace_activity: "Workspace activity"
        billing: "Billing"
      notification_types:
        heading: "Notification types"
        description: "Choose which kinds of notifications you receive."
        always_on: "Always on"
        items:
          security:
            title: "Security & sign-in"
            description: "Password changes, new device sign-ins, account security events."
          account_access:
            title: "Account & access"
            description: "Role changes and invitation reminders."
          workspace_activity:
            title: "Workspace activity"
            description: "Members joining or changing roles."
          billing:
            title: "Billing"
            description: "Plan changes and usage warnings."
      delivery_methods:
        heading: "Delivery method"
        description: "How you receive enabled notifications."
        items:
          in_app:
            title: "In-app"
            description: "Show notifications in the app's bell."
          email:
            title: "Email"
            description: "Receive notifications at your account email."
        frequency:
          label: "Frequency"
          options:
            instant: "Instant"
            daily: "Daily digest"
            weekly: "Weekly digest"
      quiet_hours:
        heading: "Quiet hours"
        description: "Pause non-security notifications during set hours each day."
        enabled_label: "Enable quiet hours"
        start_label: "From"
        end_label: "Until"
        active_days_label: "On these days"
        days:
          monday: "Mon"
          tuesday: "Tue"
          wednesday: "Wed"
          thursday: "Thu"
          friday: "Fri"
          saturday: "Sat"
          sunday: "Sun"
        days_full:
          monday: "Monday"
          tuesday: "Tuesday"
          wednesday: "Wednesday"
          thursday: "Thursday"
          friday: "Friday"
          saturday: "Saturday"
          sunday: "Sunday"
        security_reassurance: "Security alerts will always come through."
        empty_days_warning: "No days selected — quiet hours have no effect. Pick at least one day, or disable quiet hours."
      advanced:
        heading: "Advanced"
        retention_label: "Auto-delete read notifications after"
        retention_help: "Read notifications are removed this many days after you read them. Unread notifications stay until you read them. Your account's security history is kept separately on the Security page."
        retention_options:
          "30": "30 days"
          "60": "60 days"
          "90": "90 days"
          "180": "180 days"
          "365": "1 year"
      update:
        saved_announcement: "Preferences saved"
    workspace_invitation_accepted:
      message: "%{accepter} accepted your invitation to %{workspace}"
    workspace_invitation_resent:
      message: "You resent the invitation to %{invitee_email} for %{workspace}"
    workspace_invitation_declined:
      message: "%{decliner_email} declined your invitation to %{workspace}"
    workspace_role_changed:
      message: "Your role in %{workspace} changed to %{new_role}"
    workspace_invitation_expiring_soon:
      message: "Your invitation expires in %{hours_remaining} hours"
    workspace_created:
      message: "You created %{workspace}."
    workspace_joined:
      message: "You joined %{workspace}."
    workspace_member_added:
      message: "%{added_user_name} joined %{workspace}"
    # Third-person event-log voice, and it branches on the EVENT rather than on
    # who is reading: the removed member sees the same sentence the owners do.
    workspace_member_removed:
      removed: "%{user_name} was removed from %{workspace}"
      left: "%{user_name} left %{workspace}"
    workspace_capacity_approaching:
      message: "%{workspace} is approaching its %{metric} limit (%{current} of %{limit})"
    passkey_added:
      message: "A new passkey was added to your account, %{user_name}. If this wasn't you, review your passkeys now."
    password_changed:
      message: "Your password was changed for your account, %{user_name}."
    password_removed:
      message: "Your password was removed from your account, %{user_name}."
    sign_in_from_new_device:
      message: "We noticed a new sign-in from %{os}. If this wasn't you, please review your account."
    welcome:
      message: "Welcome, %{user_name}. Invitations, member changes and account activity land here. Choose what you hear about in your preferences."
    index:
      heading: "Notifications"
      filters_aria: "Filter notifications"
      filters:
        all: "All"
        unread: "Unread"
        security: "Security"
        account_access: "Access"
        workspace_activity: "Workspace"
        billing: "Billing"
      empty_all: "You're all caught up."
      item:
        mark_read: "Mark as read"
        mark_unread: "Mark as unread"
        status_unread: "Unread."
        status_read: "Read."
        time_ago: "%{time} ago"
        mark_read_aria: "Mark as read: %{summary}"
        mark_unread_aria: "Mark as unread: %{summary}"
      mark_all_read:
        action: "Mark all as read"
        title: "Mark all as read?"
        confirm: "Mark all your unread notifications as read?"
      retention_hint:
        text: "Once you've read a notification, we remove it %{period} later. Unread notifications stay until you read them."
        change: "Change retention"
  notification_mailer:
    digest:
      subject:
        daily: "Your daily %{app_name} digest"
        weekly: "Your weekly %{app_name} digest"
      preheader: "%{count} updates from your workspaces."
      heading_daily: "Today's updates"
      heading_weekly: "This week's updates"
      action: "View"
      footer: "You can change digest cadence or pause notifications in your preferences."
    workspace_role_changed:
      subject: "Your role in %{workspace} has changed"
      heading: "Your role in %{workspace} has changed"
      greeting: "Hi %{name},"
      body: "Your role in %{workspace} has changed to %{new_role}."
      action: "Open workspace"
    workspace_invitation_expiring_soon:
      subject: "Your invitation is about to expire"
      heading: "Your invitation is about to expire"
      greeting: "Hi %{name},"
      body: "Your invitation to %{workspace} expires in %{hours_remaining} hours. Accept it before then to avoid having to request a new one."
      action: "Accept invitation"
    workspace_member_added:
      subject: "You've been added to %{workspace}"
      heading: "Welcome to %{workspace}"
      greeting: "Hi %{name},"
      body: "You've been added to %{workspace} as %{new_role}."
      action: "Open workspace"
    # The one second-person surface of this event, and the only one the removed
    # member alone receives. No action link: the workspace is exactly where
    # they can no longer go.
    workspace_member_removed:
      subject: "You've been removed from %{workspace}"
      heading: "You've been removed from %{workspace}"
      greeting: "Hi %{name},"
      body: "You no longer have access to %{workspace}."
    workspace_capacity_approaching:
      subject: "%{workspace} is approaching its %{metric} limit"
      heading: "%{workspace} is approaching its %{metric} limit"
      greeting: "Hi %{name},"
      body: "%{workspace} is using %{current} of %{limit} %{metric}. To avoid hitting the cap, consider upgrading your plan or reviewing existing %{metric}."
      action: "Manage workspace settings"
    sign_in_from_new_device:
      subject: "New sign-in from %{os}"
      heading: "New sign-in to your account"
      greeting: "Hi %{name},"
      body: "We noticed your account was just signed in from a browser we haven't seen before (%{os}). If this was you, no action is needed. If you didn't sign in, change your password and review your connected accounts immediately."
      action: "Review account security"
