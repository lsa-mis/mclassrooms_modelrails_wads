en:
  invitations:
    unverified_sender: "Verify your email address before sending invitations."
  invitation_mailer:
    invite:
      subject: "You've been invited to a workspace on %{app_name}"
      greeting: "Hello,"
      body: "%{inviter} has invited you to join a workspace on %{app_name} as a %{role}. The workspace is named on the page you land on when you accept or decline."
      accept_action: "Accept invitation"
      decline_action: "Decline invitation"
      expiry_note: "This invitation expires in 7 days."
  workspaces:
    invitations:
      index:
        magic_link_label: "Share this link to invite members:"
        magic_link_section_title: "Generate a shareable magic link"
        magic_link_section_hint: "Anyone with the link can join with the role you select."
        magic_link_role_label: "Role"
        generate_magic_link: "Generate link"
      new:
        title: "Invite members"
        emails_label: "Email addresses"
        emails_hint: "One email per line, or comma-separated."
        role_label: "Role"
        submit: "Send invitations"
        no_assignable_roles: "You don't have permission to assign any of this workspace's roles, so you can't send invitations."
      create:
        sent: "%{sent} invitation(s) sent. %{skipped} skipped."
        capped: "Only the first %{cap} addresses were invited — send the rest in another batch."
        magic_link_created: "Magic link created."
      destroy:
        revoked: "Invitation revoked."
      resend:
        resent: "Invitation resent."
        recently_sent: "We already resent this within the last minute."
        magic_link_refreshed: "Magic link refreshed."
        rate_limited: "Too many requests. Please try again later."
  invitation_accepts:
    # Outside show:/create: on purpose — the shared `find_valid_invitation`
    # filter emits these for both actions and looks them up absolutely.
    invalid_token: "This invitation link is invalid."
    expired_or_used: "This invitation has expired or has already been used."
    show:
      title: "You've been invited"
      body: "%{inviter} invited you to join %{workspace} as a %{role}."
      accept: "Accept invitation"
      sign_in: "Sign in to accept"
      register: "Create an account to accept"
    create:
      success: "Welcome! You've joined the workspace."
      register_first: "Create an account to accept your invitation."
      acceptance_failed: "This invitation could not be accepted. The workspace may be at capacity or you may already be a member."
      email_mismatch: "This invitation was sent to a different email address than the one on your account. Ask your workspace administrator to invite this address."
  invitation_declines:
    # Outside show:/create: — see the note under invitation_accepts above.
    invalid: "This invitation link is invalid or has expired."
    show:
      title: "Decline invitation"
      body: "Are you sure you want to decline the invitation to %{workspace}?"
      confirm: "Decline invitation"
    create:
      success: "Invitation declined."
