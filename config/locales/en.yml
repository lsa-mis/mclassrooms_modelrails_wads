# Catch-all locale file. Day-to-day content lives in the domain-split files
# under config/locales/en/ (auth, workspaces, notifications, …), which Rails
# loads automatically. `i18n-tasks add-missing` writes new keys here, so treat
# anything that lands in this file as still needing a home.
#
# Worth remembering: YAML reads `true`, `false`, `on`, `off`, `yes` and `no` as
# booleans. Quote them when they are meant to be text.

en: {}
