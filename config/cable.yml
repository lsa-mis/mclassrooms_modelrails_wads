# Development uses Solid Cable like production: jobs run in bin/jobs, a separate process, and the async adapter
# only reaches browsers connected to the process that broadcast.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
