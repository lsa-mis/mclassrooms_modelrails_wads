# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    # `queue:` is mandatory on a `command:` entry, not cosmetic: with no queue
    # Solid Queue falls back to SolidQueue::RecurringJob (`solid_queue_recurring`),
    # which no worker in queue.yml polls — the job enqueues and is never claimed (#894).
    queue: low
    schedule: every hour at minute 12

  workspace_invitation_expiring_sweep:
    class: WorkspaceInvitationExpiringSweepJob
    queue: default
    # Sweeps every 6 hours; per-day idempotency bucket means each expiring
    # invitation produces one notification per day until accepted/declined.
    schedule: every 6 hours

  workspace_capacity_sweep:
    class: WorkspaceCapacitySweepJob
    queue: default
    # 12-hour cadence balances alert freshness with noise budget;
    # idempotency-key is per-day so owners aren't double-notified.
    schedule: every 12 hours

  digest_mailer:
    class: DigestMailerJob
    queue: mailers
    # Polls every 15 minutes against the digest_next_due_at indexed range.
    # Single SELECT scan regardless of user count; per-user logic skips
    # immediately when DND or digest_enabled? blocks. Each user's individual
    # daily/weekly cadence is honored by next_due_at_in(timezone).
    #
    # Routed to the `mailers` queue (declared in queue.yml) so SMTP-bound
    # mailer work is observable separately from DB sweeps on `default`.
    schedule: every 15 minutes

  unattached_blobs_sweep:
    class: UnattachedBlobsSweepJob
    queue: low
    # Direct-upload blobs that never got attached are permanent files on the
    # same volume as the SQLite databases; nothing else purges them. Daily
    # sweep, 2-day grace, purge_later fan-out (see the job's comment).
    schedule: every day at 5am

  expired_sessions_sweep:
    class: ExpiredSessionsSweepJob
    queue: low
    # Housekeeping for the sessions table — expiry is enforced at read time, so
    # cadence isn't security-critical. Daily is plenty; batched delete releases
    # the SQLite writer lock between rounds.
    schedule: every day at 4am

  webauthn_challenges_sweep:
    class: WebauthnChallengesSweepJob
    queue: low
    # The conditional-UI autofill path inserts a challenge row on every load
    # of the public sign-in page and nothing else ever deletes them (#378).
    # Expiry/single-use are enforced at consume time, so cadence is pure
    # housekeeping; daily with a 1-day grace.
    schedule: every day at 4:30am

  activity_log_retention_sweep:
    class: ActivityLogRetentionSweepJob
    queue: low
    # Bounds the best-effort audit trail at 12 months (#438, panel-decided).
    # The window and its rationale live as a constant in the job; the job is
    # registered in the immutability guard's allowed_bypasses. Weekly is
    # plenty for a 12-month horizon.
    schedule: every sunday at 3:30am

  notification_cleanup:
    class: NotificationCleanupJob
    queue: low
    # Runs daily at 3am UTC. Per-user batched deletion in chunks of 100 to
    # release SQLite's write lock between transactions. No retention floor at
    # this layer: the audit sweep keeps the ActivityLog record (PR 5).
    schedule: every day at 3am

  nightly_sync:
    class: SyncNightlyJob
    queue: default
    # 2:30am Detroit: off-peak for the gateway, clear of the 3am cleanup and hourly GC. A failed sync is
    # recorded on its SyncRun, never raised, so a bad night cannot feed a retry storm.
    schedule: every day at 2:30am America/Detroit

  notification_dispatch_reconcile:
    class: NotificationDispatchReconcileJob
    # `default`, not `low`, for the same reason the two workspace sweeps are:
    # this re-delivers a notification a user is waiting on and already did not
    # get, so it must not queue behind an hour of blob purges.
    queue: default
    # Re-enqueues noticed events whose EventJob never landed (#927) — the
    # enqueue happens after the gem's transaction commits, so a failed enqueue
    # leaves rows the recipient can see with no email or broadcast behind them.
    # Every 15 minutes against the job's own 5-minute grace: a recovered
    # notification is late, not missing. The sweep stamps each row as it
    # re-enqueues, so a backed-up queue cannot make cycle N+1 send a second
    # copy. Indexed scan over the partial index on (created_at) WHERE
    # dispatched_at IS NULL, which is empty in steady state.
    schedule: every 15 minutes
