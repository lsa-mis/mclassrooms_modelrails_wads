version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
    # Bumped by hand with the re-vendor pre-flight; Dependabot's default cooldown
    # proposed this git-tag gem as a downgrade three times (#665, #888, #1261).
    - dependency-name: modelrails_ui
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # One grouped PR per week instead of one per action. With SHA-pinned
  # `uses:` refs (33+ sites) this is what keeps the pin-update churn
  # survivable for the template AND every fork that inherits it.
  groups:
    github-actions:
      patterns:
        - "*"
