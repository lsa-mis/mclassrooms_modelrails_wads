name: Docker build

# Proves the production image builds. A pull request pays for it only when a
# build input changes; every push to main runs it unfiltered. /docs/developer/deployment
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Gemfile"
      - "Gemfile.lock"
      - ".tool-versions"
      - "bin/docker-entrypoint"
      - ".github/workflows/docker_build.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

# A newer push to the same PR supersedes the in-flight build; main always completes.
concurrency:
  group: docker-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build-only gate: push: false, no writes.
permissions:
  contents: read

jobs:
  docker_build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # GHA layer cache keeps a warm build near a minute; see image_scan.yml for why
      # the scan, unlike this gate, must never read it.
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: modelrails_base:ci-${{ github.sha }}
