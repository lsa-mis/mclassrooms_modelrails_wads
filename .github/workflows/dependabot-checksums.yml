# Restores the Gemfile.lock CHECKSUMS section on Dependabot PRs.
#
# Why this exists:
#   Rails 8 generates Gemfile.lock with a `CHECKSUMS` section (gem-integrity
#   verification — a supply-chain feature). Dependabot's bundler regenerates the
#   lockfile WITHOUT that section, leaving orphaned checksum lines that bundler
#   misparses. `bundle install` then fails in frozen/deployment mode (the Docker
#   build and CI), so EVERY Dependabot bump PR fails before any test runs. This
#   job re-adds the section so the bump can pass CI.
#
# Why `pull_request_target`:
#   Dependabot `pull_request` runs get a READ-ONLY GITHUB_TOKEN, so they cannot
#   push a fix. `pull_request_target` runs from main's (trusted) copy of this
#   file with a writable token, strictly gated to the dependabot[bot] author.
#   NOTE the honest threat model (#690): `bundle lock` EVALUATES the Gemfile —
#   which is Ruby — so "only runs bundle lock" is not an execution-safety
#   argument. The real containment is the checkout below pinning
#   `head.sha` (the exact tree the author gate evaluated against), so a later
#   push to the mutable branch name cannot swap code into this trusted context.
#
# CAVEAT — re-running the other checks:
#   A commit pushed with GITHUB_TOKEN does NOT re-trigger the PR's other checks
#   (GitHub loop-prevention). So the lockfile is fixed automatically, but the
#   already-failed `test` / `docker_build` checks need one manual
#   "Re-run failed jobs" click. For FULL automation, create a fine-grained PAT
#   with `contents: write`, add it as an *Actions* secret (Settings → Secrets
#   and variables → Actions) named `DEPENDABOT_CHECKSUMS_PAT` —
#   `pull_request_target` reads ACTIONS secrets, not Dependabot secrets — and
#   the push below will use it: a PAT-pushed commit DOES re-trigger CI. The
#   warning step below fires when the PAT is absent so the silent
#   GITHUB_TOKEN fallback is visible in the run log.

name: Dependabot lockfile checksums

# The trigger below is zizmor's dangerous-triggers finding, and it is
# intentional — see the header comment: actor-gated, runs `bundle lock` only
# (no gem code execution), and the push is the job's entire purpose.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    paths:
      - Gemfile.lock

permissions:
  contents: write

concurrency:
  group: dependabot-checksums-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restore-checksums:
    # PR-author id, not actor login (zizmor bot-conditions): the actor changes
    # on re-runs and a login string is spoofable, but the PR author's numeric
    # id is immutable. 49699333 is dependabot[bot]'s well-known id — the same
    # number in the git config email below.
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    steps:
      - name: Warn when the PAT is absent (GITHUB_TOKEN fallback cannot re-trigger CI)
        env:
          HAS_PAT: ${{ secrets.DEPENDABOT_CHECKSUMS_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning title=DEPENDABOT_CHECKSUMS_PAT is not set::Falling back to GITHUB_TOKEN — the checksum-restore push will NOT re-trigger the PR's other checks. Store a fine-grained contents:write PAT as an ACTIONS secret named DEPENDABOT_CHECKSUMS_PAT (pull_request_target reads Actions secrets, not Dependabot secrets)."
          fi

      - name: Checkout the PR head SHA
        # This checkout DELIBERATELY keeps its credentials — pushing the fixed
        # lockfile is the job's entire purpose (zizmor artipacked otherwise).
        # Pinned to head.sha, NOT the mutable branch name (#690): the author
        # gate above evaluated the event payload's tree; resolving a branch
        # name at checkout time would let a later push swap in a different
        # tree (a malicious Gemfile executes under bundle lock) — TOCTOU.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.DEPENDABOT_CHECKSUMS_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: false

      - name: Restore Gemfile.lock CHECKSUMS section
        run: bundle lock --add-checksums

      - name: Commit and push if the lockfile changed
        run: |
          if git diff --quiet Gemfile.lock; then
            echo "Gemfile.lock already has its CHECKSUMS section — nothing to do."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Restore Gemfile.lock CHECKSUMS section (Dependabot strips it)"
          # Detached HEAD (sha checkout) — name the target branch explicitly.
          # If the branch moved since the event, this push fails instead of
          # silently stacking onto unreviewed commits; the job re-runs on the
          # new head's own event.
          git push origin "HEAD:${HEAD_REF}"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
