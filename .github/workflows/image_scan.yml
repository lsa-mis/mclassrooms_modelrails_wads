name: Image Scan

# Scans the production image for OS-package CVEs (glibc, openssl, sqlite3,
# libvips in the ruby:slim base) — the layer brakeman (app code) and
# bundler-audit (gem deps) cannot see.
#
# Policy: runs on image-affecting PRs plus a weekly schedule, rather than on
# every PR. New base-image CVEs appear without any code change; gating every
# PR on them would red-flag unrelated green branches (the same drift mode as
# the 2026-06-09 bundler-audit oauth2 CVE on a no-change branch). The weekly
# run surfaces those independently of development activity.
#
# In practice the path filter is broader than it reads: Gemfile.lock is on it
# and dependabot bumps it constantly, so this fires on roughly 70% of PRs
# (51 of 72 over the two weeks to 2026-08-04). That is worth knowing before
# adding per-run cost here.
#
# Exceptions: to accept a finding temporarily, add the CVE ID to a
# .trivyignore file at the repo root with a comment explaining why and a
# revisit date. Trivy picks the file up automatically.
#
# Secret scanning: trivy-action runs Trivy's default scanners, which is both
# `vuln` and `secret` — this workflow was written with CVEs in mind (see
# above) but has always had secret scanning on too. That was silent until
# 2026-08-07, when Trivy's secret-scanner rules changed on the v0.70 upgrade
# and started flagging a HIGH `private-key` finding at
# .../gems/openid_connect-2.5.0/spec/mock_response/public_keys/private_key.pem
# — a mock RSA key shipped in the openid_connect gem's own test fixtures,
# published on RubyGems and identical for every install of that gem version.
# It reached the image because the Dockerfile copies the whole vendored
# bundle (COPY /usr/local/bundle /usr/local/bundle) rather than pruning gem
# spec/test directories. The gem itself predates this: it landed 2026-07-07
# for Okta OIDC, and main scanned green with it present as recently as
# 2026-08-06 — this is a scanner-version false positive, not a regression.
# trivy-secret.yaml (repo root, wired below via TRIVY_SECRET_CONFIG) allow-
# lists secrets found under a gem's own spec/ or test/ directory inside
# /usr/local/bundle specifically, so this class of noise from any vendored
# gem is covered going forward. It does not disable the `private-key` rule
# globally: a real key or credential anywhere else in the image — including
# the app's own code — still fails the build.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Gemfile.lock"
      - ".trivyignore"
      - ".github/workflows/image_scan.yml"
  workflow_dispatch:

# Least-privilege default: the scan builds locally (push: false) and reports
# via job status only — no SARIF upload, no writes.
permissions:
  contents: read

jobs:
  scan_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # ALWAYS a cold build — never the layer cache, on any trigger (#536).
      #
      # This was cached on PRs, with a documented remedy: dispatch the workflow
      # on main to refresh the shared cache so later PR scans replay patched
      # layers. That remedy does not work. GitHub Actions cache scoping makes a
      # branch read its OWN scope before falling back to the default branch, and
      # ci.yml's docker_build runs on every PR writing `mode=max` into exactly
      # that scope. An affected PR therefore replays its own stale apt layer and
      # main's refreshed one is never consulted.
      #
      # Observed 2026-07-30: four dependabot PRs reported 5 HIGH CVEs in
      # libexpat1 that Debian had already fixed. Refreshing main changed
      # nothing; each branch needed its own dispatch. The failure is
      # indistinguishable from a real finding, which is the property a security
      # gate can least afford.
      #
      # Keying the cache on the base-image digest would not have helped:
      # ruby:slim rebuilds on Debian point releases, not interim security
      # updates (see the Dockerfile's apt-get upgrade comment), so the digest is
      # unchanged precisely when the packages inside it are not.
      #
      # Cost, measured over this workflow's own run history: ~3.8 min cold
      # against ~3.1 min cached. About 45 seconds, because most of the job is
      # Trivy rather than layer building.
      #
      # load: true exports the image into the local Docker daemon — without it
      # the image exists only in the build cache and Trivy has nothing to scan.
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          no-cache: true
          platforms: linux/amd64
          tags: modelrails_base:scan-${{ github.sha }}

      # ignore-unfixed: Debian-stable bases always carry CVEs with no fixed
      # package yet; gating on them would make this permanently red and
      # trained-away. The gate is "a fix exists and we haven't taken it".
      # TRIVY_SECRET_CONFIG rather than the action's `trivy-config` input:
      # `trivy-config` maps to Trivy's general `--config` (trivy.yaml), which
      # has no dedicated field for the secret scanner's allow-rules — those
      # live in their own file (`--secret-config`, default trivy-secret.yaml)
      # per Trivy's docs. trivy-action does not expose a `secret-config`
      # input, but it passes arbitrary `env:` entries straight through to the
      # `trivy` invocation (its own README examples this with TRIVY_USERNAME,
      # TRIVY_PASSWORD, TRIVY_SKIP_DB_UPDATE), and every Trivy flag has a
      # matching TRIVY_<FLAG_NAME> env var by convention. TRIVY_SECRET_CONFIG
      # is that well-established route, not a guess.
      - name: Scan for HIGH/CRITICAL CVEs with a fix available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: modelrails_base:scan-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
