# Base-owned: the house cops (lib/rubocop) and their scopes, on top of
# omakase's style. Each message says what broke, how to fix it, which pattern
# applies, and where to read more. A fork turns a cop off in the fork-owned
# .rubocop/app.yml, never here, so upstream syncs stay clean. See
# /docs/developer/getting-started (Turning a house cop off in your fork).
# A file under app/models/<model>/ defines its trait in nested form.
ModelRails/ModelConcernNamespace:
  Enabled: true
  Include:
    - "app/models/*/**/*.rb"

# Tenant scoping is opt-in; no model installs a default_scope.
ModelRails/NoDefaultScope:
  Enabled: true
  Include:
    - "app/models/**/*.rb"

# A system spec waits for observable state, never for a clock.
ModelRails/NoSleepInSystemSpecs:
  Enabled: true
  Include:
    - "spec/system/**/*.rb"

# A translation call carries no inline default. The vendored UI primitives
# (rails g modelrails_ui:add) keep the fallbacks the gem ships with — they are
# the gem's files, regenerated by its installer, not the app's copy. Views are
# covered by .erb_lint.yml's Rubocop linter running this one cop.
ModelRails/NoI18nDefault:
  Enabled: true
  Include:
    - "app/**/*.rb"
  Exclude:
    - "app/components/ui/**/*"

# The signed-in user is Current.user. The one current_user definition is the
# bridge Pundit and the mounted engines call, on ApplicationController.
ModelRails/NoCurrentUserShim:
  Enabled: true
  Include:
    - "app/**/*.rb"
  Exclude:
    - "app/controllers/application_controller.rb"

# The stack floor: Rails 8.1+, Propshaft, import maps, Hotwire, built-in auth,
# the Solid trio. A Gemfile line that brings in what the floor replaces fails.
ModelRails/StackFloor:
  Enabled: true
  Include:
    - "**/Gemfile"

# Every routed action is one of the seven. ApplicationController is abstract:
# no route reaches it, and its public methods are helper_method exposures.
ModelRails/RestfulActions:
  Enabled: true
  Include:
    - "app/controllers/**/*_controller.rb"
  Exclude:
    - "app/controllers/application_controller.rb"

# Current is request state. Two model-side readers, by design: Trackable (the
# audit actor and activity workspace — a callback cannot take an argument) and
# Tenanted's opt-in for_current_workspace scope. Current itself defines it.
ModelRails/NoAmbientCurrentInModels:
  Enabled: true
  Include:
    - "app/models/**/*.rb"
  Exclude:
    - "app/models/current.rb"
    - "app/models/concerns/trackable.rb"
    - "app/models/concerns/tenanted.rb"
